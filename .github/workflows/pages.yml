# Publishes bootstrap.sh on GitHub Pages as /install, the short install link:
#   curl -fsSL https://caioax.github.io/lyne-dots/install | bash
# Pages is set to deploy from GitHub Actions (Settings › Pages › Source)
name: pages

on:
  push:
    branches: [main]
    paths: [bootstrap.sh, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - name: Site
        run: |
          mkdir _site
          cp bootstrap.sh _site/install

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
