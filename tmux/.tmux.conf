# --- BOOTSTRAP TPM ---
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

# --- SYSTEM & CORE ---
set-option -sa terminal-overrides ",xterm*:Tc"
set -s default-terminal "tmux-256color"
set -g mouse on

# --- CUSTOM WINDOW RENAME LOGIC ---
set -g @lock_icon "󰓹"
set -g automatic-rename on

# DISPLAY FORMAT (With 20 character limit)
set -g automatic-rename-format "#{=20:?#{==:#{=1:window_name},#{@lock_icon}},#{window_name},#{?#{==:#{pane_current_command},nvim},#{b:pane_title},#{pane_current_command}}}"

# RENAME SHORTCUT
bind -N "Rename the window (empty: automatic name)" , command-prompt -p "(Rename Window)" \
  "if-shell \"[ -n '%1' ]\" \
  \"rename-window '#{@lock_icon} %1'\" \
  \"rename-window ''\" ; \
  set-window-option automatic-rename on"

# --- RELOAD CONFIGURATION ---
bind -N "Reload the tmux config" r source-file ~/.tmux.conf \; display " Configuration reloaded successfully!!"

# --- PREFIX ---
unbind C-b
set -g prefix C-Space
bind -N "Send Ctrl+Space to the program" C-Space send-prefix

# --- INDEXES ---
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# --- IMAGES & GRAPHICS ---
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# --- VI MODE & NAVIGATION ---
set-window-option -g mode-keys vi
bind-key -N "Start a selection" -T copy-mode-vi v send-keys -X begin-selection
bind-key -N "Copy the selection and leave copy mode" -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind-key -N "Leave copy mode" -T copy-mode-vi Escape send-keys -X cancel

# --- SPLITS ---
bind -N "Split side by side" | split-window -h -c "#{pane_current_path}"
bind -N "Split top and bottom" - split-window -v -c "#{pane_current_path}"

# --- STATUS BAR ---
set -g status-position top
# tmux-continuum hooks its autosave check into status-right, so every status
# redraw runs it (~13 processes): 15 s instead of 1 s. zsh refreshes the
# status on cd, so the path on the right still follows at once
set -g status-interval 15
set -g status-style "bg=default,fg=white"
set -g status-left-length 100
set -g status-right-length 100

# LEFT SIDE
set -g status-left "#[bg=default]#{?client_prefix,#[fg=yellow],#[fg=brightblack]}\
#{?client_prefix,#[fg=black]#[bg=yellow]󰌌 ,#[fg=brightwhite]#[bg=brightblack]❐ }#S "

# RIGHT SIDE
set -g status-right "#[fg=blue,bg=default,bold]   \
#[fg=white,bg=default,bold]#{s|$HOME|~|:pane_current_path} "

# WINDOWS
bind -N "New window in the same folder" c new-window -c "#{pane_current_path}"
set -g window-status-separator ""
# tmux 3.8 underlines the current window by default; the format has its colors
set -g window-status-current-style default
set -g window-status-format "#[fg=blue,bg=default] #I #W "
set -g window-status-current-format "#[fg=black,bg=blue,bold] #I #W \
#[fg=blue,bg=default]#{?#{==:#{window_index},#{session_windows}},,}"

# --- POPUPS ---
# The Neovims in popups set LYNE_NVIM_SOLO: never a project's Neovim
# (Neovim's local-plugins/project-instance.nvim)
# Lazygit in the pane's folder
bind -N "Lazygit in the pane's folder (popup)" G display-popup -E -w 90% -h 90% -d "#{pane_current_path}" 'command -v lazygit >/dev/null && exec lazygit || { echo "lazygit is not installed: sudo pacman -S lazygit"; read -r _; }'
# A scratch terminal that stays: the session "scratch" in a popup, the same
# key hides it again (from inside it, it detaches the popup's client). The
# popup's $TMUX starts with this server's socket
bind -N "Scratch terminal: shows or hides the same one (popup)" S if -F '#{==:#{session_name},scratch}' { detach-client } { display-popup -E -w 80% -h 75% -d "#{pane_current_path}" 'TMUX= tmux -S "${TMUX%%,*}" new-session -A -s scratch \; set status off' }
# tmux's sessions and the project folders (~/Dev, lyne-dots): switch, or
# open a folder in a session of its own (Neovim's config/projects.lua)
bind -N "Projects and sessions: switch, or start one in a folder (popup)" P display-popup -E -e LYNE_NVIM_SOLO=1 -w 70% -h 60% 'nvim -c "lua require([[config.projects]]).pick({ quit = true })"'
# Every shortcut of tmux and Neovim in one search (Neovim's config/shortcuts.lua)
bind -N "Search the shortcuts (tmux and Neovim)" ? display-popup -E -e LYNE_NVIM_SOLO=1 -w 90% -h 80% 'nvim -c "lua require([[config.shortcuts]]).pick({ quit = true })"'
bind -N "Neovim guide: the keys by task (popup)" N display-popup -E -e LYNE_NVIM_SOLO=1 -w 90% -h 90% "nvim -R ~/.config/nvim/README.md"
bind -N "tmux guide: the keys by task (popup)" T display-popup -E -e LYNE_NVIM_SOLO=1 -w 90% -h 90% 'nvim -R "${LYNE_DOTS:-$HOME/.lyne-dots}/tmux/README.md"'

# --- PLUGINS ---
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# --- SESSIONS (tmux-resurrect + tmux-continuum) ---
# Saved every 15 minutes, and by the shell's power menu before it logs out,
# reboots or shuts down; the first tmux server started after that brings them
# back (prefix + C-s / C-r save and restore by hand)
set -g @continuum-restore 'on'
# Panes that ran Neovim come back with that folder's session (persistence.nvim)
set -g @resurrect-processes '"~nvim->nvim +RestoreSession *"'
# Close everything and forget the save, so the next tmux starts empty (the
# shell's tkf does the same from outside tmux)
bind -N "Close every session and forget the save: the next tmux starts empty (asks first)" X confirm-before -p "Close every session and forget the save? (y/n)" { run-shell 'rm -f "$(bash -c ". ~/.tmux/plugins/tmux-resurrect/scripts/helpers.sh && last_resurrect_file" 2>/dev/null)"' ; kill-server }
# Neovim hears when its pane loses the focus (it saves its session then too)
set -g focus-events on

# --- INTEGRATION LOGIC (SMART SPLITS) ---
# Neovim's smart-splits (with its tmux backend, smart-splits-nvim/backend-tmux)
# sets the pane option @pane-is-vim while it runs in a pane: those panes get
# the keys and move between Neovim's splits first, then out to tmux's panes

# NAVIGATION (Ctrl + h/j/k/l)
bind-key -N "Focus the pane on the left (Neovim splits first)" -n C-h if -F '#{@pane-is-vim}' 'send-keys C-h' 'select-pane -L'
bind-key -N "Focus the pane below (Neovim splits first)" -n C-j if -F '#{@pane-is-vim}' 'send-keys C-j' 'select-pane -D'
bind-key -N "Focus the pane above (Neovim splits first)" -n C-k if -F '#{@pane-is-vim}' 'send-keys C-k' 'select-pane -U'
bind-key -N "Focus the pane on the right (Neovim splits first)" -n C-l if -F '#{@pane-is-vim}' 'send-keys C-l' 'select-pane -R'
# Copy mode has its own key table
bind-key -T copy-mode-vi C-h select-pane -L
bind-key -T copy-mode-vi C-j select-pane -D
bind-key -T copy-mode-vi C-k select-pane -U
bind-key -T copy-mode-vi C-l select-pane -R

# RESIZING (Alt + h/j/k/l)
bind-key -N "Grow or shrink the pane to the left (Neovim splits first)" -n M-h if -F '#{@pane-is-vim}' 'send-keys M-h' 'resize-pane -L 3'
bind-key -N "Grow or shrink the pane downwards (Neovim splits first)" -n M-j if -F '#{@pane-is-vim}' 'send-keys M-j' 'resize-pane -D 3'
bind-key -N "Grow or shrink the pane upwards (Neovim splits first)" -n M-k if -F '#{@pane-is-vim}' 'send-keys M-k' 'resize-pane -U 3'
bind-key -N "Grow or shrink the pane to the right (Neovim splits first)" -n M-l if -F '#{@pane-is-vim}' 'send-keys M-l' 'resize-pane -R 3'

# SWAP POSITION (Ctrl + Shift + h/j/k/l)
bind-key -N "Swap with the pane on the left" -n C-S-h swap-pane -d -t "{left-of}"
bind-key -N "Swap with the pane below" -n C-S-j swap-pane -d -t "{down-of}"
bind-key -N "Swap with the pane above" -n C-S-k swap-pane -d -t "{up-of}"
bind-key -N "Swap with the pane on the right" -n C-S-l swap-pane -d -t "{right-of}"

# WINDOW/TAB NAVIGATION (Ctrl + Alt + h/l)
bind-key -N "Previous window" -n C-M-h previous-window
bind-key -N "Next window" -n C-M-l next-window

# --- TPM Initialization ---
run '~/.tmux/plugins/tpm/tpm'
