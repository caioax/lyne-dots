# vim:fileencoding=utf-8:foldmethod=marker

# --- TEMA ---
include current-theme.conf

# --- 1. FONTE ---
font_family      CaskaydiaCove Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0
disable_ligatures never

# --- 2. CURSOR & MOUSE ---
cursor_shape block
cursor_blink_interval 0
mouse_hide_wait 3.0
url_style curly
detect_urls yes
copy_on_select no

# --- 3. WINDOW & APPEARANCE ---
background_opacity 0.9
background_blur 1
window_padding_width 4
enable_audio_bell no
hide_window_decorations yes
confirm_os_window_close 0

# --- 4. LAYOUTS ---
enabled_layouts splits,stack

# --- 5. NEOVIM INTEGRATION (SCROLLBACK) ---
scrollback_pager nvim -c 'set ft=man' -

# --- 6. KEY MAPPINGS (SHORTCUTS) ---
clear_all_shortcuts no

# === ESSENTIAL UTILITIES (KEPT) ===
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
map ctrl+shift+f5 load_config_file

# === KEYS FOR TMUX ===
# A terminal sends Ctrl+Shift+letter like Ctrl+letter (and adds nothing for
# Shift with Ctrl+Alt), so tmux could never tell them apart. These send them
# as CSI u (ESC [ <letter's code> ; <1 + Shift 1, Alt 2, Ctrl 4> u), which
# tmux reads: Ctrl+Shift+h/j/k/l swap panes, Ctrl+Alt+Shift+h/l move the
# window (tab) left / right, like Super+Ctrl+Shift+H/L moves a window to the
# previous / next workspace
map ctrl+shift+h send_text all \x1b[104;6u
map ctrl+shift+j send_text all \x1b[106;6u
map ctrl+shift+k send_text all \x1b[107;6u
map ctrl+shift+l send_text all \x1b[108;6u
map ctrl+alt+shift+h send_text all \x1b[104;8u
map ctrl+alt+shift+l send_text all \x1b[108;8u

# Prevents accidentally opening/closing Kitty windows (Use Tmux for that!)
map ctrl+shift+enter no_op
map ctrl+shift+w no_op
map ctrl+shift+t no_op
map ctrl+shift+q no_op
